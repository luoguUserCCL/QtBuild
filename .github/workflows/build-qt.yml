name: Build Qt for MinGW-w64 MCF

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt tag or branch (e.g. v6.11.2)'
        default: 'v6.11.2'
        type: string
      build_type:
        description: 'CMAKE_BUILD_TYPE'
        default: 'Release'
        type: choice
        options: ['Release', 'RelWithDebInfo', 'Debug']
      build_parallel:
        description: 'Ninja parallelism (use 3 to leave 1 core for system)'
        default: '3'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "=== STEP 0 - Checkout workflow repo ==="
        uses: actions/checkout@v4

      - name: "=== STEP 1 - Install build dependencies ==="
        run: |
          set -ex
          echo "=== STEP install-deps START ==="
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build perl python3 pkg-config gperf \
            zlib1g-dev libpcre2-dev libdouble-conversion-dev \
            libglib2.0-dev libb2-dev libicu-dev libzstd-dev \
            libxkbcommon-dev libxcb1-dev libxcb-cursor0 libxcb-keysyms1 \
            libxcb-icccm4 libxcb-image0 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev libharfbuzz-dev
          echo "--- versions ---"
          cmake --version | head -1
          ninja --version
          perl --version | head -2
          python3 --version
          gperf --version | head -1
          pkg-config --version
          echo "--- which ---"
          which cmake ninja perl python3 gperf pkg-config
          echo "=== STEP install-deps END ==="

      - name: "=== STEP 2 - Download MinGW toolchain from release ==="
        run: |
          set -ex
          echo "=== STEP download-tc START ==="
          mkdir -p /opt/mingw-mcf /tmp/tc-dl
          cd /tmp/tc-dl
          URL_BASE="https://github.com/luoguUserCCL/QtBuild/releases/download/toolchain-v20260701"
          TC_NAME="x86_64-w64-mingw32-ucrt-mcfgthread-gcc-16.1.1-20260701-linux-amd64"
          echo "--- downloading ${TC_NAME}.tar.xz (compact dot:giga progress) ---"
          wget -q --progress=dot:giga \
            "${URL_BASE}/${TC_NAME}.tar.xz" \
            -O toolchain.tar.xz
          echo "--- downloading sha256 file ---"
          wget -q --progress=dot:giga \
            "${URL_BASE}/${TC_NAME}.tar.xz.sha256" \
            -O toolchain.tar.xz.sha256
          ls -la
          echo "--- sha256 verify (compare hashes; we renamed file to toolchain.tar.xz) ---"
          EXPECTED=$(awk '{print $1}' toolchain.tar.xz.sha256)
          ACTUAL=$(sha256sum toolchain.tar.xz | awk '{print $1}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "SHA256 MISMATCH"; exit 1; fi
          echo "SHA256 OK"
          echo "--- extract ---"
          tar -xf toolchain.tar.xz --strip-components=1 -C /opt/mingw-mcf
          echo "--- verify install ---"
          ls /opt/mingw-mcf/bin/ | head -10
          echo "--- gcc -v ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-gcc -v 2>&1 | tail -8
          echo "--- Thread model check ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-gcc -v 2>&1 | grep -E 'Thread model|^gcc version|Target:'
          echo "--- disk usage ---"
          du -sh /opt/mingw-mcf
          df -h /
          echo "=== STEP download-tc END ==="

      - name: "=== STEP 3 - Add toolchain to PATH ==="
        run: |
          echo "/opt/mingw-mcf/bin" >> $GITHUB_PATH
          echo "PATH updated"

      - name: "=== STEP 4 - Clone Qt base ==="
        run: |
          set -ex
          echo "=== STEP clone-qt START ==="
          git clone --depth 1 --branch "${{ inputs.qt_version }}" \
            https://github.com/qt/qtbase.git /tmp/qtbase
          cd /tmp/qtbase
          git log -1
          echo "--- top-level structure ---"
          ls -la | head -20
          echo "--- .qmake.conf (if any) ---"
          head -10 .qmake.conf 2>&1 || echo "(no .qmake.conf)"
          echo "--- CMakeLists.txt top ---"
          head -20 CMakeLists.txt
          echo "--- disk usage ---"
          du -sh /tmp/qtbase
          df -h /
          echo "=== STEP clone-qt END ==="

      - name: "=== STEP 5 - CMake configure ==="
        run: |
          set -ex
          echo "=== STEP cmake-configure START ==="
          cd /tmp/qtbase
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/qt-install \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-mingw-mcf.cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_BENCHMARKS=OFF \
            -DQT_BUILD_MANUAL_TESTS=OFF \
            -DFEATURE_concurrent=ON \
            -DFEATURE_thread=ON \
            -DFEATURE_future=ON \
            -DFEATURE_widgets=ON \
            -DFEATURE_network=ON \
            -DFEATURE_sql=ON \
            -DFEATURE_sqlmodel=ON \
            -DFEATURE_xml=ON \
            -DFEATURE_testlib=ON \
            -DFEATURE_opengl=OFF \
            -DFEATURE_opengl_desktop=OFF \
            -DFEATURE_opengles2=OFF \
            -DFEATURE_openssl=OFF \
            -DFEATURE_vulkan=OFF \
            -DFEATURE_dbus=OFF \
            -DFEATURE_libudev=OFF \
            -DFEATURE_printdialog=OFF \
            -DFEATURE_printer=OFF \
            -DFEATURE_pdf=OFF \
            -DFEATURE_designer=OFF \
            -DFEATURE_3d=OFF \
            -DINPUT_openssl=no \
            2>&1 | tee /tmp/configure.log
          echo "--- configure exit code: $? ---"
          echo "--- configure summary highlights ---"
          grep -E '(Qt version|Qt Companion|Install prefix|Build type|Compiler|Features|CMAKE_|error:|Error|Warning|NOTFOUND)' /tmp/configure.log | head -50
          echo "--- disk usage after configure ---"
          du -sh /tmp/qtbase/build
          df -h /
          echo "=== STEP cmake-configure END ==="

      - name: "=== STEP 6 - Build Qt ==="
        run: |
          set -ex
          echo "=== STEP cmake-build START ==="
          cd /tmp/qtbase
          cmake --build build --parallel ${{ inputs.build_parallel }} 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "--- build exit code: $BUILD_RC ---"
          tail -100 /tmp/build.log
          echo "--- disk usage after build ---"
          du -sh /tmp/qtbase/build
          df -h /
          echo "=== STEP cmake-build END ==="
          if [ $BUILD_RC -ne 0 ]; then exit $BUILD_RC; fi

      - name: "=== STEP 7 - Install Qt ==="
        run: |
          set -ex
          echo "=== STEP cmake-install START ==="
          cd /tmp/qtbase
          cmake --install build 2>&1 | tee /tmp/install.log
          INSTALL_RC=${PIPESTATUS[0]}
          echo "--- install dir size + tree ---"
          du -sh /tmp/qt-install/
          ls -la /tmp/qt-install/
          echo "--- bin ---"
          ls -la /tmp/qt-install/bin/ 2>/dev/null | head -30
          echo "--- lib ---"
          ls -la /tmp/qt-install/lib/ 2>/dev/null | head -30
          echo "--- lib/cmake ---"
          ls -la /tmp/qt-install/lib/cmake/ 2>/dev/null | head -20
          echo "--- include (top-level only) ---"
          ls /tmp/qt-install/include/ 2>/dev/null | head -30
          echo "=== STEP cmake-install END ==="
          if [ $INSTALL_RC -ne 0 ]; then exit $INSTALL_RC; fi

      - name: "=== STEP 8 - Verify with hello Qt program ==="
        run: |
          set -ex
          echo "=== STEP verify-qt START ==="
          cat > /tmp/hello.cpp <<'EOF'
          #include <QCoreApplication>
          #include <iostream>
          int main(int argc, char *argv[]) {
              QCoreApplication a(argc, argv);
              std::cout << "Qt on mingw-mcf works!" << std::endl;
              return 0;
          }
          EOF
          echo "--- hello.cpp ---"
          cat /tmp/hello.cpp
          echo "--- compile ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-g++ -static -O2 /tmp/hello.cpp -o /tmp/hello.exe \
            -I/tmp/qt-install/include -I/tmp/qt-install/include/QtCore \
            -L/tmp/qt-install/lib -lQt6Core \
            -std=c++17
          echo "--- file + PE info ---"
          file /tmp/hello.exe
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-objdump -f /tmp/hello.exe | head -10
          echo "--- imports ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-objdump -p /tmp/hello.exe | grep -E 'DLL Name|Import' | head -30
          echo "=== STEP verify-qt END ==="

      - name: "=== STEP 9 - Package Qt install dir ==="
        run: |
          set -ex
          echo "=== STEP package START ==="
          cd /tmp
          QT_TAG="${{ inputs.qt_version }}"
          QT_VER="${QT_TAG#v}"
          NAME="qt-mingw-mcf-${QT_VER}"
          echo "Packaging as: $NAME"
          tar -cJf ${NAME}.tar.xz \
            --transform "s|^qt-install|${NAME}|" \
            qt-install
          ls -la ${NAME}.tar.xz
          sha256sum ${NAME}.tar.xz > ${NAME}.tar.xz.sha256
          cat ${NAME}.tar.xz.sha256
          echo "=== STEP package END ==="

      - name: "=== STEP 10 - Upload Qt tarball artifact ==="
        uses: actions/upload-artifact@v4
        with:
          name: qt-mingw-mcf-${{ inputs.qt_version }}
          path: |
            /tmp/qt-mingw-mcf-*.tar.xz
            /tmp/qt-mingw-mcf-*.tar.xz.sha256
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: "=== STEP 11 - Upload build logs (always, even on failure) ==="
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.qt_version }}
          path: |
            /tmp/configure.log
            /tmp/build.log
            /tmp/install.log
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn
