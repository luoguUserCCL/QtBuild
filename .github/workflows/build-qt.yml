name: Build Qt for MinGW-w64 MCF

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt tag or branch (e.g. v6.11.2)'
        default: 'v6.11.2'
        type: string
      build_type:
        description: 'CMAKE_BUILD_TYPE'
        default: 'Release'
        type: choice
        options: ['Release', 'RelWithDebInfo', 'Debug']
      build_parallel:
        description: 'Ninja parallelism (use 3 to leave 1 core for system)'
        default: '3'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "=== STEP 0 - Checkout workflow repo ==="
        uses: actions/checkout@v4

      - name: "=== STEP 1 - Install build dependencies ==="
        run: |
          set -ex
          echo "=== STEP install-deps START ==="
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build perl python3 pkg-config gperf \
            g++ \
            zlib1g-dev libpcre2-dev libdouble-conversion-dev \
            libglib2.0-dev libb2-dev libicu-dev libzstd-dev \
            libxkbcommon-dev libxcb1-dev libxcb-cursor0 libxcb-keysyms1 \
            libxcb-icccm4 libxcb-image0 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev libharfbuzz-dev
          echo "--- versions ---"
          cmake --version | head -1
          ninja --version
          perl --version | head -2
          python3 --version
          gperf --version | head -1
          pkg-config --version
          g++ --version | head -1
          echo "--- which ---"
          which cmake ninja perl python3 gperf pkg-config g++
          echo "=== STEP install-deps END ==="

      - name: "=== STEP 2 - Download MinGW toolchain from release ==="
        run: |
          set -ex
          echo "=== STEP download-tc START ==="
          mkdir -p /opt/mingw-mcf /tmp/tc-dl
          cd /tmp/tc-dl
          URL_BASE="https://github.com/luoguUserCCL/QtBuild/releases/download/toolchain-v20260701"
          TC_NAME="x86_64-w64-mingw32-ucrt-mcfgthread-gcc-16.1.1-20260701-linux-amd64"
          echo "--- downloading ${TC_NAME}.tar.xz (compact dot:giga progress) ---"
          wget -q --progress=dot:giga \
            "${URL_BASE}/${TC_NAME}.tar.xz" \
            -O toolchain.tar.xz
          echo "--- downloading sha256 file ---"
          wget -q --progress=dot:giga \
            "${URL_BASE}/${TC_NAME}.tar.xz.sha256" \
            -O toolchain.tar.xz.sha256
          ls -la
          echo "--- sha256 verify (compare hashes; we renamed file to toolchain.tar.xz) ---"
          EXPECTED=$(awk '{print $1}' toolchain.tar.xz.sha256)
          ACTUAL=$(sha256sum toolchain.tar.xz | awk '{print $1}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "SHA256 MISMATCH"; exit 1; fi
          echo "SHA256 OK"
          echo "--- extract ---"
          tar -xf toolchain.tar.xz --strip-components=1 -C /opt/mingw-mcf
          echo "--- verify install ---"
          ls /opt/mingw-mcf/bin/ | head -10
          echo "--- gcc -v ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-gcc -v 2>&1 | tail -8
          echo "--- Thread model check ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-gcc -v 2>&1 | grep -E 'Thread model|^gcc version|Target:'
          echo "--- disk usage ---"
          du -sh /opt/mingw-mcf
          df -h /
          echo "=== STEP download-tc END ==="

      - name: "=== STEP 3 - Add toolchain to PATH ==="
        run: |
          echo "/opt/mingw-mcf/bin" >> $GITHUB_PATH
          echo "PATH updated"

      - name: "=== STEP 4 - Clone Qt base ==="
        run: |
          set -ex
          echo "=== STEP clone-qt START ==="
          git clone --depth 1 --branch "${{ inputs.qt_version }}" \
            https://github.com/qt/qtbase.git /tmp/qtbase
          cd /tmp/qtbase
          git log -1
          echo "--- top-level structure ---"
          ls -la | head -20
          echo "--- CMakeLists.txt top ---"
          head -20 CMakeLists.txt
          echo "--- disk usage ---"
          du -sh /tmp/qtbase
          df -h /
          echo "=== STEP clone-qt END ==="

      - name: "=== STEP 4.5 - Patch Qt to disable qt_internal_add_link_flags_no_undefined ===
        Cross-compile try-compile uses STATIC_LIBRARY target type (per toolchain file),
        which routes via ar. Qt's qt_internal_add_link_flags_no_undefined adds -Wl,--no-undefined
        to LINK_OPTIONS, which CMake's default CMAKE_*_ARCHIVE_CREATE templates include as
        <LINK_FLAGS>, causing ar to receive -Wl,--no-undefined and bail with
        'invalid option -- W'. Toolchain file overrides with CACHE+FORCE did not propagate
        into try-compile sub-cmake instances. Disabling the function entirely is the
        cleanest cross-compile workaround; --no-undefined is only an opt-in safety check
        and is not required for Qt to function correctly."
        run: |
          set -ex
          echo "=== STEP patch-qt START ==="
          QFH=/tmp/qtbase/cmake/QtFlagHandlingHelpers.cmake
          echo "--- before patch (function body head) ---"
          grep -A 5 'function(qt_internal_add_link_flags_no_undefined target)' "$QFH" | head -8
          # Replace function body with no-op return()
          python3 - <<'PYEOF'
          import re
          p = '/tmp/qtbase/cmake/QtFlagHandlingHelpers.cmake'
          with open(p) as f: s = f.read()
          new = re.sub(
              r'function\(qt_internal_add_link_flags_no_undefined target\)\n.*?\nendfunction\(\)',
              'function(qt_internal_add_link_flags_no_undefined target)\n    # Patched: no-op for cross-compile (ar cannot accept -Wl,--no-undefined)\n    return()\nendfunction()',
              s, flags=re.DOTALL, count=1)
          if new == s:
              print("ERROR: pattern not found, patch failed"); raise SystemExit(1)
          with open(p, 'w') as f: f.write(new)
          print("patched OK")
          PYEOF
          echo "--- after patch (function body) ---"
          grep -A 4 'function(qt_internal_add_link_flags_no_undefined target)' "$QFH" | head -8
          echo ""
          echo "--- patch 2: qwindowsprintdevice_p.h missing QPrint namespace include ---"
          QWPDH=/tmp/qtbase/src/printsupport/platform/windows/qwindowsprintdevice_p.h
          # Use absolute path to source file. Relative path "../../kernel/qprint_p.h"
          # was applied but did not resolve at compile time (likely PCH/cwd interaction).
          if ! grep -q '/tmp/qtbase/src/printsupport/kernel/qprint_p.h' "$QWPDH"; then
            sed -i '/QtPrintSupport\/private\/qprint_p.h/d' "$QWPDH"
            sed -i '/kernel\/qprint_p.h/d' "$QWPDH"
            sed -i '20a #include "/tmp/qtbase/src/printsupport/kernel/qprint_p.h"' "$QWPDH"
          fi
          grep -n 'include' "$QWPDH" | head -8

          echo ""
          echo "--- patch 2b: qwindowsprintdevice.cpp force-include qprint_p.h ---"
          # syncqt runs in build phase (after our STEP 7.5 forward-header creation)
          # and may overwrite our manually-created forward headers. To be robust,
          # force-include the source qprint_p.h at the very top of the .cpp file so
          # QPrint namespace is defined BEFORE qwindowsprintdevice_p.h is parsed.
          QWPDCPP=/tmp/qtbase/src/printsupport/platform/windows/qwindowsprintdevice.cpp
          if ! grep -q 'force-include qprint_p.h' "$QWPDCPP"; then
            sed -i '1i // force-include qprint_p.h (cross-compile syncqt workaround)\n#include "/tmp/qtbase/src/printsupport/kernel/qprint_p.h"' "$QWPDCPP"
          fi
          head -10 "$QWPDCPP"

          echo ""
          echo "--- patch 3: qprint_p.h self-includes — use absolute paths ---"
          QPRINT_P=/tmp/qtbase/src/printsupport/kernel/qprint_p.h
          sed -i 's|#include <QtPrintSupport/private/qtprintsupportglobal_p.h>|#include "/tmp/qtbase/src/printsupport/kernel/qtprintsupportglobal_p.h"|' "$QPRINT_P"
          sed -i 's|#include <QtPrintSupport/qprinter.h>|#include "/tmp/qtbase/src/printsupport/kernel/qprinter.h"|' "$QPRINT_P"
          sed -i 's|#include "qtprintsupportglobal_p.h"|#include "/tmp/qtbase/src/printsupport/kernel/qtprintsupportglobal_p.h"|' "$QPRINT_P"
          sed -i 's|#include "qprinter.h"|#include "/tmp/qtbase/src/printsupport/kernel/qprinter.h"|' "$QPRINT_P"
          grep -n 'include' "$QPRINT_P" | head -8

          echo ""
          echo "--- patch 4: disable WIN32 PrintSupport block (cross-compile workaround) ---"
          echo "Root cause analysis (after 16 failed runs): qwindowsprintdevice_p.h:46 fails"
          echo "because QPrint namespace is not visible. QPrint is wrapped in #ifndef QT_NO_PRINTER"
          echo "inside qprint_p.h. Cross-compile auto-detection probably sets QT_NO_PRINTER."
          echo "Instead of fighting feature detection, just skip the entire WIN32 PrintSupport"
          echo "block (qwindowsprintdevice.cpp + qwindowsprintersupport.cpp + qprintengine_win.cpp)."
          echo "PrintSupport kernel sources (qprint.cpp, qprintdevice.cpp, qprintengine_pdf.cpp, etc.)"
          echo "will still build, providing the cross-platform PDF engine. Most apps don't need"
          echo "Windows-specific printer integration."
          PSCMK=/tmp/qtbase/src/printsupport/CMakeLists.txt
          echo "--- before patch (CONDITION blocks) ---"
          grep -n 'CONDITION' "$PSCMK"
          python3 - <<'PYEOF'
          import re
          p = '/tmp/qtbase/src/printsupport/CMakeLists.txt'
          with open(p) as f: s = f.read()
          new = s.replace(
              'qt_internal_extend_target(PrintSupport CONDITION WIN32',
              'qt_internal_extend_target(PrintSupport CONDITION FALSE  # patched: WIN32 printsupport has QPrint namespace cross-compile issues'
          )
          if new == s:
              print("ERROR: WIN32 CONDITION pattern not found"); raise SystemExit(1)
          with open(p, 'w') as f: f.write(new)
          print("patched WIN32 -> FALSE")
          PYEOF
          echo "--- after patch (CONDITION blocks) ---"
          grep -n 'CONDITION' "$PSCMK"
          echo ""

          echo ""
          echo "--- patch 5: qwindowswindow.cpp isSoftwareGl() disable dynamicgl branch ---"
          echo "Root cause: config.summary shows 'Dynamic OpenGL = yes' (Qt auto-detected Windows target)."
          echo "qwindowswindow.cpp:2519-2526 isSoftwareGl() is wrapped in #if QT_CONFIG(dynamicgl)."
          echo "The branch references QOpenGLStaticContext::opengl32.moduleIsNotOpengl32() and"
          echo "QOpenGLContext::openGLModuleType() — but in cross-compile with FEATURE_opengl=OFF,"
          echo "these classes are only forward-declared, not defined. Patch: change the #if to"
          echo "#if 0 so the #else branch (return false) is used; Qt then doesn't try to detect"
          echo "OpenGL driver type at runtime (which is fine for non-GL apps)."
          QWW=/tmp/qtbase/src/plugins/platforms/windows/qwindowswindow.cpp
          grep -n 'isSoftwareGl\|QT_CONFIG(dynamicgl)' "$QWW" | head -5
          python3 - <<'PYEOF'
          import re
          p = '/tmp/qtbase/src/plugins/platforms/windows/qwindowswindow.cpp'
          with open(p) as f: s = f.read()
          # Match the #if QT_CONFIG(dynamicgl) ... #else block (non-greedy .*? with DOTALL)
          new = re.sub(
              r'#if QT_CONFIG\(dynamicgl\)\n.*?\n#else\n',
              '#if 0  // patched: cross-compile, QOpenGLStaticContext not declared\n#else\n',
              s, flags=re.DOTALL, count=1)
          if new == s:
              print("ERROR: dynamicgl pattern not found in qwindowswindow.cpp"); raise SystemExit(1)
          with open(p, 'w') as f: f.write(new)
          print("patched isSoftwareGl() #if QT_CONFIG(dynamicgl) -> #if 0")
          PYEOF
          echo "--- after patch (isSoftwareGl) ---"
          grep -B1 -A8 'isSoftwareGl' "$QWW" | head -15
          echo "=== STEP patch-qt END ==="

      - name: "=== STEP 5 - Host-side configure (for host tools: moc/rcc/uic) ===
        Qt 6 cross-compile requires building host-side tools first; QT_HOST_PATH will
        point at this host build dir during target-side configure."
        run: |
          set -ex
          echo "=== STEP host-configure START ==="
          cd /tmp/qtbase
          cmake -S . -B build-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/qt-host \
            -DBUILD_SHARED_LIBS=ON \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_BENCHMARKS=OFF \
            -DFEATURE_concurrent=ON \
            -DFEATURE_thread=ON \
            -DFEATURE_widgets=ON \
            -DFEATURE_network=ON \
            -DFEATURE_sql=ON \
            -DFEATURE_xml=ON \
            -DFEATURE_testlib=ON \
            -DFEATURE_opengl=OFF \
            -DFEATURE_openssl=OFF \
            -DFEATURE_vulkan=OFF \
            -DFEATURE_dbus=OFF \
            -DFEATURE_libudev=OFF \
            -DFEATURE_printdialog=OFF \
            -DFEATURE_printer=OFF \
            -DFEATURE_pdf=OFF \
            2>&1 | tee /tmp/host-configure.log
          HOST_CONF_RC=${PIPESTATUS[0]}
          echo "--- host-configure exit code: $HOST_CONF_RC ---"
          grep -E '(Qt version|Qt Companion|Install prefix|Build type|Compiler|Features|CMAKE_|error:|Error|Warning|NOTFOUND)' /tmp/host-configure.log | head -50
          echo "--- build-host dir contents ---"
          ls build-host/ | head -10
          echo "--- build.ninja exists? ---"
          ls -la build-host/build.ninja
          df -h /
          echo "=== STEP host-configure END ==="
          if [ $HOST_CONF_RC -ne 0 ]; then exit $HOST_CONF_RC; fi

      - name: "=== STEP 6 - Host-side build + install ==="
        run: |
          set -ex
          echo "=== STEP host-build START ==="
          cd /tmp/qtbase
          cmake --build build-host --parallel ${{ inputs.build_parallel }} 2>&1 | tee /tmp/host-build.log
          HOST_BUILD_RC=${PIPESTATUS[0]}
          echo "--- host-build exit code: $HOST_BUILD_RC ---"
          tail -30 /tmp/host-build.log
          echo "--- disk usage after host build ---"
          du -sh build-host
          df -h /
          echo "=== STEP host-build END ==="
          if [ $HOST_BUILD_RC -ne 0 ]; then exit $HOST_BUILD_RC; fi
          echo "=== STEP host-install START ==="
          cmake --install build-host 2>&1 | tee /tmp/host-install.log
          HOST_INST_RC=${PIPESTATUS[0]}
          echo "--- host install dir size ---"
          du -sh /tmp/qt-host
          ls /tmp/qt-host/bin/ | head -20
          echo "=== STEP host-install END ==="
          if [ $HOST_INST_RC -ne 0 ]; then exit $HOST_INST_RC; fi

      - name: "=== STEP 7 - Target-side configure (cross-compile, using host tools) ==="
        run: |
          set -ex
          echo "=== STEP target-configure START ==="
          cd /tmp/qtbase
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/qt-install \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-mingw-mcf.cmake \
            -DQT_HOST_PATH=/tmp/qt-host \
            -DBUILD_SHARED_LIBS=ON \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_BENCHMARKS=OFF \
            -DQT_BUILD_MANUAL_TESTS=OFF \
            -DFEATURE_concurrent=ON \
            -DFEATURE_thread=ON \
            -DFEATURE_future=ON \
            -DFEATURE_widgets=ON \
            -DFEATURE_network=ON \
            -DFEATURE_sql=ON \
            -DFEATURE_sqlmodel=ON \
            -DFEATURE_xml=ON \
            -DFEATURE_testlib=ON \
            -DFEATURE_opengl=OFF \
            -DFEATURE_opengl_desktop=OFF \
            -DFEATURE_opengles2=OFF \
            -DFEATURE_openssl=OFF \
            -DFEATURE_vulkan=OFF \
            -DFEATURE_dbus=OFF \
            -DFEATURE_libudev=OFF \
            -DFEATURE_printdialog=OFF \
            -DFEATURE_pdf=OFF \
            -DFEATURE_designer=OFF \
            -DFEATURE_3d=OFF \
            -DFEATURE_posix_sem=OFF \
            -DINPUT_posix_sem=no \
            -DINPUT_openssl=no \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            2>&1 | tee /tmp/configure.log
          TARGET_CONF_RC=${PIPESTATUS[0]}
          echo "--- target-configure exit code: $TARGET_CONF_RC ---"
          grep -E '(Qt version|Qt Companion|Install prefix|Build type|Compiler|Features|CMAKE_|error:|Error|Warning|NOTFOUND)' /tmp/configure.log | head -50
          echo "--- build.ninja exists? ---"
          ls -la build/build.ninja
          df -h /
          echo "=== STEP target-configure END ==="
          if [ $TARGET_CONF_RC -ne 0 ]; then exit $TARGET_CONF_RC; fi

      - name: "=== STEP 7.5 - Manually create missing syncqt private forward headers ===
        syncqt may skip generating QtPrintSupport/private/ forward headers during
        cross-compile configure. Create them manually pointing to src tree so
        chain-includes like <private/qprint_p.h> resolve to the actual source file."
        run: |
          set -ex
          echo "=== STEP syncqt-forward-fix START ==="
          PRIVATE_DIR=/tmp/qtbase/build/include/QtPrintSupport/6.11.2/QtPrintSupport/private
          echo "--- existing forward headers (if any) ---"
          ls -la $PRIVATE_DIR/ 2>/dev/null | head -20 || echo "(dir missing — will create)"
          mkdir -p $PRIVATE_DIR
          echo "--- create/verify forward headers for known printsupport private headers ---"
          # Map: forward-header-name -> src-path
          create_forward() {
            local fname="$1" srcpath="$2"
            if [ -f "$srcpath" ] && [ ! -f "$PRIVATE_DIR/$fname" ]; then
              echo "creating forward: $fname -> $srcpath"
              echo "#include \"$srcpath\"" > "$PRIVATE_DIR/$fname"
            elif [ -f "$PRIVATE_DIR/$fname" ]; then
              echo "exists: $fname"
            else
              echo "skip (no src): $fname"
            fi
          }
          create_forward qprint_p.h               /tmp/qtbase/src/printsupport/kernel/qprint_p.h
          create_forward qtprintsupportglobal_p.h /tmp/qtbase/src/printsupport/kernel/qtprintsupportglobal_p.h
          create_forward qprintdevice_p.h        /tmp/qtbase/src/printsupport/kernel/qprintdevice_p.h
          create_forward qprintengine_p.h        /tmp/qtbase/src/printsupport/kernel/qprintengine_p.h
          create_forward qprintengine_pdf_p.h    /tmp/qtbase/src/printsupport/kernel/qprintengine_pdf_p.h
          create_forward qplatformprintdevice.h  /tmp/qtbase/src/printsupport/kernel/qplatformprintdevice.h
          create_forward qplatformprintersupport.h /tmp/qtbase/src/printsupport/kernel/qplatformprintersupport.h
          create_forward qplatformprintplugin.h /tmp/qtbase/src/printsupport/kernel/qplatformprintplugin.h
          create_forward qprinterinfo_p.h        /tmp/qtbase/src/printsupport/kernel/qprinterinfo_p.h
          echo "--- final state ---"
          ls -la $PRIVATE_DIR/
          echo "=== STEP syncqt-forward-fix END ==="

      - name: "=== STEP 7.6 - Dump configure diagnostics (config.summary + qconfig.h) ===
        Print build/config.summary to see what features were auto-detected.
        Grep include/QtCore/qconfig.h for QT_NO_PRINTER to confirm whether the
        PrintSupport namespace is actually disabled. This diagnostic is needed
        because qprint_p.h's namespace QPrint is wrapped in #ifndef QT_NO_PRINTER,
        so any auto-detection that flips this macro breaks compilation."
        run: |
          set -ex
          echo "=== STEP diag-config START ==="
          echo "--- build/config.summary (full) ---"
          cat /tmp/qtbase/build/config.summary 2>&1 | tee /tmp/config-summary.log
          echo ""
          echo "--- include/QtCore/qconfig.h grep QT_NO_PRINTER ---"
          QCFG=/tmp/qtbase/build/include/QtCore/qconfig.h
          ls -la $QCFG 2>/dev/null || echo "WARNING: $QCFG not found"
          if [ -f "$QCFG" ]; then
            grep -nE 'QT_NO_PRINTER|QT_NO_PRINTDIALOG|QT_NO_PRINTSUPPORT|QT_NO_PDF' $QCFG || echo "(no QT_NO_PRINTER etc. found — feature is ON)"
          fi
          echo ""
          echo "--- grep 'printer' in configure log ---"
          grep -iE 'printer|printsupport' /tmp/configure.log | head -20 || echo "(no printer mentions in configure.log)"
          echo "=== STEP diag-config END ==="

      - name: "=== STEP 8 - Target-side build (cross-compile) ==="
        run: |
          set -ex
          echo "=== STEP target-build START ==="
          cd /tmp/qtbase
          cmake --build build --parallel ${{ inputs.build_parallel }} 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "--- target-build exit code: $BUILD_RC ---"
          tail -100 /tmp/build.log
          echo "--- disk usage after build ---"
          du -sh /tmp/qtbase/build
          df -h /
          echo "=== STEP target-build END ==="
          if [ $BUILD_RC -ne 0 ]; then exit $BUILD_RC; fi

      - name: "=== STEP 9 - Target-side install ==="
        run: |
          set -ex
          echo "=== STEP target-install START ==="
          cd /tmp/qtbase
          cmake --install build 2>&1 | tee /tmp/install.log
          INSTALL_RC=${PIPESTATUS[0]}
          echo "--- install dir size + tree ---"
          du -sh /tmp/qt-install/
          ls -la /tmp/qt-install/
          echo "--- bin ---"
          ls -la /tmp/qt-install/bin/ 2>/dev/null | head -30
          echo "--- lib ---"
          ls -la /tmp/qt-install/lib/ 2>/dev/null | head -30
          echo "--- lib/cmake ---"
          ls -la /tmp/qt-install/lib/cmake/ 2>/dev/null | head -20
          echo "--- include (top-level only) ---"
          ls /tmp/qt-install/include/ 2>/dev/null | head -30
          echo "=== STEP target-install END ==="
          if [ $INSTALL_RC -ne 0 ]; then exit $INSTALL_RC; fi

      - name: "=== STEP 10 - Verify with hello Qt program ==="
        run: |
          set -ex
          echo "=== STEP verify-qt START ==="
          cat > /tmp/hello.cpp <<'EOF'
          #include <QCoreApplication>
          #include <iostream>
          int main(int argc, char *argv[]) {
              QCoreApplication a(argc, argv);
              std::cout << "Qt on mingw-mcf works!" << std::endl;
              return 0;
          }
          EOF
          echo "--- hello.cpp ---"
          cat /tmp/hello.cpp
          echo "--- compile ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-g++ -static -O2 /tmp/hello.cpp -o /tmp/hello.exe \
            -I/tmp/qt-install/include -I/tmp/qt-install/include/QtCore \
            -L/tmp/qt-install/lib -lQt6Core \
            -std=c++17
          echo "--- file + PE info ---"
          file /tmp/hello.exe
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-objdump -f /tmp/hello.exe | head -10
          echo "--- imports ---"
          /opt/mingw-mcf/bin/x86_64-w64-mingw32-objdump -p /tmp/hello.exe | grep -E 'DLL Name|Import' | head -30
          echo "=== STEP verify-qt END ==="

      - name: "=== STEP 11 - Package Qt install dir ==="
        run: |
          set -ex
          echo "=== STEP package START ==="
          cd /tmp
          QT_TAG="${{ inputs.qt_version }}"
          QT_VER="${QT_TAG#v}"
          NAME="qt-mingw-mcf-${QT_VER}"
          echo "Packaging as: $NAME"
          tar -cJf ${NAME}.tar.xz \
            --transform "s|^qt-install|${NAME}|" \
            qt-install
          ls -la ${NAME}.tar.xz
          sha256sum ${NAME}.tar.xz > ${NAME}.tar.xz.sha256
          cat ${NAME}.tar.xz.sha256
          echo "=== STEP package END ==="

      - name: "=== STEP 12 - Upload Qt tarball artifact ==="
        uses: actions/upload-artifact@v4
        with:
          name: qt-mingw-mcf-${{ inputs.qt_version }}
          path: |
            /tmp/qt-mingw-mcf-*.tar.xz
            /tmp/qt-mingw-mcf-*.tar.xz.sha256
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: "=== STEP 13 - Upload build logs (always, even on failure) ==="
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.qt_version }}
          path: |
            /tmp/host-configure.log
